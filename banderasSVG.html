<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banderas con SVG</title>
    <style>
        svg{
            box-shadow: 2px 2px 6px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- encabezado -->
    <header>
        <h1>Banderas del mundo con vectores SVG</h1>
    </header>
    <main>
        <section>
            <div class="bandera">
                <h2>Francia</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="2" height="4" x="0" Y="0" fill="#0000ff"/>
                    <rect width="2" height="4" x="2" Y="0" fill="#ffffff"/>
                    <rect width="2" height="4" x="4" Y="0" fill="#FF2400"/>
                </svg>
            </div>
            <div class="bandera">
                <h2>Russia</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="2" x="0" Y="0" fill="#ffffff"/>
                    <rect width="9" height="2" x="0" Y="2" fill="#0000ff"/>
                    <rect width="9" height="2" x="0" Y="4" fill="#FF2400"/>
                </svg>
            </div>
            <div class="bandera">                
                <h2>Holanda</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="2" x="0" Y="0" fill="#FF2400"/>
                    <rect width="9" height="2" x="0" Y="2" fill="#ffffff"/>
                    <rect width="9" height="2" x="0" Y="4" fill="#0000ff"/>
                </svg>
            </div>
            <div class="bandera">
                <h2>Colombia</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="2" x="0" Y="0" fill="#FFCD00"/>
                    <rect width="6" height="1" x="0" Y="2" fill="#003893"/>
                    <rect width="6" height="1" x="0" Y="3" fill="#C8102E"/>
                </svg>
            </div>
            <div class="bandera">
                <h2>Japón</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="2" x="0" Y="0" fill="#FFF"/>
                    <circle cx="3" cy="2" r="1" fill="#CE1126"/>    
                </svg>
            </div>
            <div class="bandera">
                <h2>Suiza</h2>
                <svg width="120" height="120" viewBox="0 0 5 5">
                    <rect width="5" height="5" x="0" Y="0" fill="#cd212a"/>
                    <polygon points="2,1 3,1 3,2 4,2 4,3 3,3 
                                    3,4 2,4 2,3 1,3 1,2 2,2" fill="#fff"/>

                </svg>
            </div>
            <div class="bandera">
                <h2>Finlandia</h2>
                <svg width="150" height="100" viewBox="0 0 18 12">
                    <rect width="18" height="12" fill="#ffffff"/>
                    <rect width="3" height="12" x="5" Y="0" fill="#002f6c"/>
                    <rect width="18" height="3" x="0" Y="4" fill="#002f6c"/>
                </svg>
            </div>
            <div class="bandera">                
                <h2>Alemania</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="2" x="0" Y="0" fill="#000000"/>
                    <rect width="9" height="2" x="0" Y="2" fill="#FF2400"/>
                    <rect width="9" height="2" x="0" Y="4" fill="#FFCD00"/>
                </svg></div>
            <div class="bandera">
                <h2>Noruega</h2>
                <svg width="150" height="100" viewBox="0 0 18 12">
                    <rect width="20" height="12" fill="#cd212a"/>
                    <rect width="4" height="12" x="5" Y="0" fill="#ffffff"/>
                    <rect width="20" height="4" x="0" Y="4" fill="#ffffff"/>
                    <rect width="2" height="12" x="6" Y="0" fill="#002f6c"/>
                    <rect width="20" height="2" x="0" Y="5" fill="#002f6c"/>
                    
                </svg>
            </div>
            <div class="bandera">
                <h2>Puerto Rico</h2>
                <svg width="150" height="100" viewBox="0 0 18 12">
                <rect width="18" height="12" x="0" y="0" fill="#cd212a"/>
                <rect width="18" height="2.4" x="0" y="2.4" fill="#fff"/>
                <rect width="18" height="2.4" x="0" y="7.2" fill="#fff"/>
                <polygon points="0,0 0,12 7,6" fill="#0038a8"/>
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#fff" transform ="translate(3 6) rotate(36) scale (1)"/>
                </svg>
            </div>
            <div class="bandera">
                <h2>China</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#cd212a"/>
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#FFCD00" transform ="translate(1 1) rotate(36) scale (0.5)"/>
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#FFCD00" transform ="translate(2 0.4) rotate(75) scale (0.1)"/>
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#FFCD00" transform ="translate(2.3 .8) rotate(50) scale (0.1)"/>
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#FFCD00" transform ="translate(2.3 1.3) rotate(36) scale (0.1)"/>
                    
                    <polygon points ="1.4266,0.4635	0.5706,	-0.1854 
                    0.8817,-1.2135	0.0000,	-0.6000 
                    -0.8817,-1.2135	-0.5706, -0.1854 
                    -1.4266,0.4635	-0.3527, 0.4854 
                    0.00,1.5000 0.3527,0.4854"
                    fill="#FFCD00" transform ="translate(2 1.7) rotate(60) scale (0.1)"/>

"
                </svg>
        </section>
    </main>
    <!-- pie de página -->
    <footer>
        <p>Todos los derechos reservados&copy; 2026 | TSJ</p>
    </footer>
</body>
</html>
